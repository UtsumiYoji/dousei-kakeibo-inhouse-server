services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run worker"

  linebot:
    image: ${LINEBOT_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 3001
      KAKEIBO_API_BASE_URL: http://app:3000
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_ALLOWED_USER_IDS: ${LINE_ALLOWED_USER_IDS}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-15}
      SUMMARY_SCHEDULE_CONFIG_PATH: ${SUMMARY_SCHEDULE_CONFIG_PATH:-/app/config/summary-schedule.json}
    volumes:
      - ./summary-schedule.json:/app/config/summary-schedule.json:ro
    depends_on:
      - app

  # 公開経路。ホストのポートは開けず、Docker ネットワーク内の app / linebot へ転送する。
  # 公開ホスト名と転送先は Cloudflare 側のトンネル設定(remote-managed)で管理する。
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
      - linebot

volumes:
  postgres-data:
