services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start"

  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run worker"

  linebot:
    image: ${LINEBOT_IMAGE}
    restart: unless-stopped
    environment:
      PORT: 3001
      KAKEIBO_API_BASE_URL: http://app:3000
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_ALLOWED_USER_IDS: ${LINE_ALLOWED_USER_IDS}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-15}
      SUMMARY_SCHEDULE_CONFIG_PATH: ${SUMMARY_SCHEDULE_CONFIG_PATH:-/app/config/summary-schedule.json}
    volumes:
      - ./summary-schedule.json:/app/config/summary-schedule.json:ro
    depends_on:
      - app

  # 毎日 BACKUP_TIME に pg_dump して ./backups へ出力する。pCloud への転送は
  # ホスト側の pcloud-sync-manager がこのディレクトリを同期して行う。
  db-backup:
    image: postgres:16
    restart: unless-stopped
    # ホストのユーザー(既定 1000)で書き込み、同期ツールから読めるようにする
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/bash", "/usr/local/bin/db-backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: Asia/Tokyo
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/db-backup.sh:/usr/local/bin/db-backup.sh:ro
      - type: bind
        source: ./backups
        target: /backups
        bind:
          # ディレクトリが無いと root 所有で自動作成されてしまうため、存在しなければ起動しない
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy

  # 公開経路。ホストのポートは開けず、Docker ネットワーク内の app / linebot へ転送する。
  # 公開ホスト名と転送先は Cloudflare 側のトンネル設定(remote-managed)で管理する。
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
      - linebot

volumes:
  postgres-data:
